        - generic [ref=e129]:
          - paragraph [ref=e130]: 调度策略联动 → 策略不是贴在底部的开关：切换后计划曲线重算、链路流向速度变化、底部窗口同步——调度员获得的是直观推演能力，而非一个按钮。
          - paragraph [ref=e131]: 下钻闭环 → 空间（L0→L3）与数据（集群→站→舱→簇）同步收敛，最终落到电池簇的可执行信息（压差、绝缘、循环），支撑"看到问题→定位问题→处置问题"的完整动作链，缩短故障定位时间。
