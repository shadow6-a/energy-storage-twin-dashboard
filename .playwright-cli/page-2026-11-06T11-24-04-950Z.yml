        - generic [ref=e41]: FOR DECISION-MAKERS
      - generic [ref=e42]:
        - generic [ref=e43]:
          - text: 01 · 面向长期值守的视觉设计
          - paragraph [ref=e44]: 针对 7×24 小时控制室值守场景：低饱和深色底 + 高对比关键数值，降低视觉干扰与值守人员视觉疲劳；告警信息四级色唯一且全局贯穿，永远优先突出；动效仅保留告警脉冲与功率链路，符合电力运维人员的读屏习惯，而非参观展示的炫技。
        - generic [ref=e45]:
          - text: 02 · 告警闭环 = 完整运维流转
          - paragraph [ref=e46]: 未确认 → 确认 → 闭环 / 抑制，是完整的运维工单流转逻辑，不是简单提示弹窗；告警数据单向同步，保证台账、地图、舱体视图数据一致性，运维人员无需多界面核对信息——从一条告警定位到故障电池簇只需 4 次点击。
        - generic [ref=e47]:
          - text: 03 · 解耦设计，对接真实设备
          - paragraph [ref=e48]: 模拟数据层与视图层分离，接口边界清晰（字段映射表已给出），可平滑对接现场 BMS / PCS / EMS 真实数据源；自研轻量 3D 性能可控，工控机核显即可运行——这是可演进的工程方案，不是只能看的原型。
