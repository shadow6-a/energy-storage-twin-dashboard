      - generic [ref=e125]:
        - generic [ref=e126]:
          - paragraph [ref=e127]: 强光控制室 → 面板底色压深、关键数值高对比等宽字体（1.5m 距离可辨读；禁用大面积渐变避免环境反光——直接目标是降低值守人员 8 小时以上的视觉疲劳。
