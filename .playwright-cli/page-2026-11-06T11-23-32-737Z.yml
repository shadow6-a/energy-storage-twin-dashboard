      - heading "运维值守版 · 组件与视觉规范" [level=1] [ref=e33]
      - paragraph [ref=e34]: 面向 7×24 小时强光控制室值守场景的低饱和深蓝工业风组件体系。所有组件遵循四条原则： 信息层级优先于装饰、告警色严格规范（红 / 橙 / 黄 / 绿）、数字等宽对齐；3D 孪生与 2D 面板同一套语义色。 设计基准 1920×1080，输出适配 2K / 4K 拼接屏。
