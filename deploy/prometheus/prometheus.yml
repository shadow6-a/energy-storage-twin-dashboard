# 储能孪生桥接指标抓取：本机桥接默认 9001（容器内经 host.docker.internal 访问宿主机）
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ess-bridge
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9001']
  - job_name: ess-bridge-health
    metrics_path: /health
    static_configs:
      - targets: ['host.docker.internal:9001']
