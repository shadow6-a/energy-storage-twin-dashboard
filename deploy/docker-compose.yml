# Prometheus + Grafana local observability stack (v2.3)
# Usage: cd deploy && docker compose up -d
#   Prometheus: http://localhost:9090  (scrapes bridge /metrics via host.docker.internal)
#   Grafana:    http://localhost:3000  (dashboard provisioned, anonymous viewer enabled)
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ess-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ess-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus
    restart: unless-stopped
